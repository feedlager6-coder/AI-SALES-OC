# Railway configuration for the Web (Next.js) service.
# In Railway: create a service, set Root Directory to "/" (repo root).
#
# ─── Required environment variables ───────────────────────────────────────────
#   NODE_ENV          — set to "production"  ← REQUIRED: build fails with non-standard value
#   PORT              — set automatically by Railway (next start reads it)
#   BETTER_AUTH_SECRET — must match the API service value
#   BETTER_AUTH_URL   — public URL of the API service (https://api.railway.app)
#   INTERNAL_API_URL  — Railway-internal URL of the API service used for the
#                        /api/* server-side rewrite. Use the Railway private
#                        network URL (e.g. https://api.railway.internal) or the
#                        public API URL. Defaults to http://localhost:3001 if unset.
#   NEXT_PUBLIC_API_URL — leave empty ("") — web uses relative /api/* rewrites
#
# ─── Standalone output structure ──────────────────────────────────────────────
# Because outputFileTracingRoot points to the monorepo root, Next.js standalone
# places server.js at:  apps/web/.next/standalone/apps/web/server.js
# Static files are copied there by the "copy:standalone" script after build.

[build]
builder = "NIXPACKS"
# NODE_ENV=production is required — Next.js build fails with non-standard NODE_ENV.
# "..." suffix: builds @ai-sales-os/web AND all workspace dependencies in order.
# Static assets are copied into the standalone bundle after the Next.js build.
buildCommand = "pnpm install && NODE_ENV=production pnpm turbo run build --filter=@ai-sales-os/web... && cd apps/web && pnpm copy:standalone"

[deploy]
# HOSTNAME=0.0.0.0 binds on all interfaces (required for Railway's proxy).
# PORT is injected by Railway and read automatically by Next.js standalone server.
startCommand = "HOSTNAME=0.0.0.0 node apps/web/.next/standalone/apps/web/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
