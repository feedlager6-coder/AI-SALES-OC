# Railway configuration for the API service.
# In Railway: create a service, set Root Directory to "/" (repo root),
# and point it at this config by placing this file in the repo root
# OR set the service's build/start commands manually in the Railway UI.
#
# Required environment variables (set in Railway service settings):
#   DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
#   ENCRYPTION_KEY, NODE_ENV=production, PORT (Railway sets this automatically)
#
# Optional: OPENAI_API_KEY, TWOGIS_API_KEY, HUNTER_API_KEY, SNOV_API_KEY,
#           DADATA_API_KEY, MAILGUN_API_KEY, MAILGUN_DOMAIN, BREVO_API_KEY,
#           TELEGRAM_BOT_TOKEN, ANTHROPIC_API_KEY

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm turbo run build --filter='./packages/*' && pnpm turbo run build --filter=@ai-sales-os/api"

[deploy]
startCommand = "node apps/api/dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[deploy.healthcheckPath]]
path = "/api/health"
