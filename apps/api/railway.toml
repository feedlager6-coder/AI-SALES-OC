# Railway configuration for the API service.
# In Railway: create a service, set Root Directory to "/" (repo root).
#
# ─── Required environment variables ───────────────────────────────────────────
#   DATABASE_URL      — PostgreSQL 16 connection string (postgres://...)
#   REDIS_URL         — Redis 7 connection string (redis://...)
#   BETTER_AUTH_SECRET — Auth signing secret, ≥32 chars  (openssl rand -hex 32)
#   BETTER_AUTH_URL   — Public URL of this API service   (https://api.railway.app)
#   ENCRYPTION_KEY    — 64 hex chars / 32 bytes AES-256  (openssl rand -hex 32)
#   WEB_URL           — public URL of the Web service  (https://web.railway.app)
#   NODE_ENV          — set to "production"
#   PORT              — set automatically by Railway
#
# ─── Optional environment variables ───────────────────────────────────────────
#   OPENAI_API_KEY, ANTHROPIC_API_KEY  — AI providers
#   MAILGUN_API_KEY, MAILGUN_DOMAIN    — email sending via Mailgun
#   BREVO_API_KEY                      — email sending via Brevo
#   TWOGIS_API_KEY                     — 2GIS company search
#   HUNTER_API_KEY, SNOV_API_KEY       — email discovery
#   DADATA_API_KEY                     — Russian company registry enrichment
#   TELEGRAM_BOT_TOKEN                 — Telegram notifications
#   MINIO_ENDPOINT, MINIO_PORT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MINIO_BUCKET, MINIO_USE_SSL

[build]
builder = "NIXPACKS"
# Build order:
#   1. pnpm install          — create workspace symlinks (no --frozen-lockfile:
#                              Railway Linux differs in optional deps)
#   2. turbo build (api...)  — compile packages/* then apps/api in dependency order
#   3. pnpm deploy --legacy  — materialize workspace packages as REAL FILES
#                              (not symlinks) into apps/api/production/node_modules.
#                              Fixes "Cannot find module '@ai-sales-os/*'" at runtime
#                              caused by pnpm symlinks being unresolvable after
#                              Railway's post-build layer finalisation.
buildCommand = "pnpm install && pnpm turbo run build --filter=@ai-sales-os/api... && pnpm --filter=@ai-sales-os/db db:migrate && pnpm --filter=@ai-sales-os/api deploy --legacy --prod apps/api/production"

[deploy]
startCommand = "node apps/api/production/dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[deploy.healthcheckPath]]
# /health/live — basic liveness (always 200 if server is up)
# /health/ready — checks DB + Redis connectivity (200 when ready, 503 otherwise)
path = "/health/live"
